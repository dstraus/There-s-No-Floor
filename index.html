<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#8fd3ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="There's No Floor">
  <title>There's No Floor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="hud-level"></div>
      <div id="hud-time">0:00.00</div>
    </div>
    <div class="hud-right">
      <div id="hud-lives"></div>
      <div id="hud-coins"></div>
    </div>
    <div id="hud-powers"></div>
    <button id="btn-pause" class="icon-btn" data-act="pause">II</button>
    <div id="toast"></div>
  </div>
  <div id="flash"></div>

  <!-- Touch controls -->
  <div id="touch" class="hidden">
    <div id="joy-base"><div id="joy-knob"></div></div>
    <div id="joy-hint">MOVE</div>
    <div id="dpad" class="hidden">
      <button class="dpad-btn diag" data-dir="up-left" aria-label="Up Left">&#8598;</button>
      <button class="dpad-btn" data-dir="up" aria-label="Up">&#9650;</button>
      <button class="dpad-btn diag" data-dir="up-right" aria-label="Up Right">&#8599;</button>
      <button class="dpad-btn" data-dir="left" aria-label="Left">&#9664;</button>
      <button class="dpad-btn" data-dir="right" aria-label="Right">&#9654;</button>
      <button class="dpad-btn diag" data-dir="down-left" aria-label="Down Left">&#8601;</button>
      <button class="dpad-btn" data-dir="down" aria-label="Down">&#9660;</button>
      <button class="dpad-btn diag" data-dir="down-right" aria-label="Down Right">&#8600;</button>
    </div>
    <button id="btn-jump">JUMP</button>
  </div>

  <!-- Screens -->
  <div id="menu" class="screen">
    <h1 class="title">THERE'S<br>NO FLOOR</h1>
    <p class="sub">Don't look down.</p>
    <button class="btn" data-act="play">PLAY</button>
    <button class="btn endless" id="btn-endless" data-act="endless">INFINITY</button>
    <button class="btn" data-act="levels">LEVELS</button>
    <div class="row">
      <button class="btn small tg-music" data-act="music">MUSIC</button>
      <button class="btn small tg-sfx" data-act="sfx">SFX</button>
    </div>
    <div class="row">
      <button class="btn small tg-touch" data-act="touchmode">TOUCH: JOYSTICK</button>
      <button class="btn small tg-autocam" data-act="autocam">AUTO CAM: OFF</button>
    </div>
    <button class="btn small install hidden" id="btn-install" data-act="install">INSTALL APP</button>
    <div class="help">
      <p class="pc-only">WASD move &middot; SPACE jump &middot; MOUSE look &middot; Q/E turn &middot; ESC pause</p>
      <p class="touch-only" id="touch-help">Left side: move &middot; Right side: look &middot; Button: jump</p>
    </div>
  </div>

  <div id="levels" class="screen hidden">
    <h2>SELECT LEVEL</h2>
    <div id="level-grid"></div>
    <button class="btn small" data-act="menu">BACK</button>
  </div>

  <div id="pause" class="screen hidden">
    <h2>PAUSED</h2>
    <button class="btn" data-act="resume">RESUME</button>
    <button class="btn" data-act="restart">RESTART</button>
    <div class="row">
      <button class="btn small tg-music" data-act="music">MUSIC</button>
      <button class="btn small tg-sfx" data-act="sfx">SFX</button>
    </div>
    <div class="row">
      <button class="btn small tg-touch" data-act="touchmode">TOUCH: JOYSTICK</button>
      <button class="btn small tg-autocam" data-act="autocam">AUTO CAM: OFF</button>
    </div>
    <button class="btn small" data-act="menu">MAIN MENU</button>
  </div>

  <div id="complete" class="screen hidden">
    <h2 class="win">LEVEL COMPLETE!</h2>
    <div id="complete-stats" class="stats"></div>
    <button class="btn" id="btn-next" data-act="next">NEXT LEVEL</button>
    <button class="btn" data-act="restart">RETRY</button>
    <button class="btn small" data-act="menu">MAIN MENU</button>
  </div>

  <div id="gameover" class="screen hidden">
    <h2 class="lose">GAME OVER</h2>
    <p class="sub">You fell out of lives.</p>
    <div id="gameover-stats" class="stats hidden"></div>
    <button class="btn" data-act="restart">TRY AGAIN</button>
    <button class="btn small" data-act="menu">MAIN MENU</button>
  </div>

  <!-- Three.js: local copy if present, otherwise CDN -->
  <script src="js/vendor/three.min.js"></script>
  <script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"><\/script>');</script>
  <script src="js/audio.js?v=10"></script>
  <script src="js/input.js?v=10"></script>
  <script src="js/levels.js?v=12"></script>
  <script src="js/player.js?v=10"></script>
  <script src="js/world.js?v=10"></script>
  <script src="js/main.js?v=11"></script>
</body>
</html>
